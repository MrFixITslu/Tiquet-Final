services:
  v79-tiquet-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: v79-tiquet-manager
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3050
      - DATABASE_PATH=app/data/tiquet.db
      # Automatically detected by standard Nginx reverse proxy containers (e.g. jwilder/nginx-proxy, Nginx Proxy Manager)
      - VIRTUAL_HOST=tiquet.v79sl.duckdns.org
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=tiquet.v79sl.duckdns.org
    ports:
      - "3050:80"
    volumes:
      - tiquet_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://192.168.100.163:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - proxy_network

volumes:
  tiquet_data:

networks:
  proxy_network:
    external: true
